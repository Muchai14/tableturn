[project]
name = "tableturn-backend"
version = "0.1.0"
description = "TableTurn FastAPI API with a database-agnostic SQLAlchemy repository"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pyyaml>=6,<7",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "openapi-spec-validator>=0.7,<1", "jsonschema>=4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
